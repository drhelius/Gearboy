version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
    exclude-paths:
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/agentics-maintenance.yml"
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1 */2 *"