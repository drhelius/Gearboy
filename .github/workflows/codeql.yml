name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.devcontainer/**'
  pull_request:
    branches: [ "master" ]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
        - language: actions
          build-mode: none
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
  
    - name: Update OS
      if: matrix.language == 'c-cpp'
      run: sudo apt-get update -qq

    - name: Install dependencies
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get install -y build-essential cmake \
        libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
        libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
        libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libxtst-dev

    - name: Build and install SDL3
      if: matrix.language == 'c-cpp'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SDL3_TAG=$(gh release view --repo libsdl-org/SDL --json tagName -q '.tagName')
        echo "Building SDL3 $SDL3_TAG"
        git clone --depth 1 --branch "$SDL3_TAG" https://github.com/libsdl-org/SDL.git /tmp/SDL3
        cmake -S /tmp/SDL3 -B /tmp/SDL3/build -DCMAKE_INSTALL_PREFIX=/usr -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
        cmake --build /tmp/SDL3/build -j$(nproc)
        sudo cmake --install /tmp/SDL3/build

    - name: Get build number
      if: matrix.language == 'c-cpp'
      run: |
        echo "BUILD_NUMBER=$(git describe --abbrev=7 --dirty --always --tags)" >> $GITHUB_ENV

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml
   
    - name: Build
      if: matrix.language == 'c-cpp'
      run: make codeql
      working-directory: platforms/linux

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        output: sarif-results
        upload: ${{ (matrix.language == 'c-cpp' && 'never') || 'always' }}

    - name: Filter dependency results
      if: matrix.language == 'c-cpp'
      env:
        SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
      run: |
        for sarif_file in "$SARIF_DIR"/*.sarif; do
          jq '(.runs[] | select(.results != null).results) |= map(select((((.locations[0].physicalLocation.artifactLocation.uri // "") | test("(^|/)platforms/shared/dependencies/")) | not)))' "$sarif_file" > "$sarif_file.filtered"
          mv "$sarif_file.filtered" "$sarif_file"
        done

    - name: Upload filtered CodeQL results
      if: matrix.language == 'c-cpp'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif-output }}
        category: "/language:${{matrix.language}}"
